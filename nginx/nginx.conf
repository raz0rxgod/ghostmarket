events {
    worker_connections 1024;
}

http {
    client_max_body_size 20M;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    server {
        listen 80;
        server_name _;

        # API бэкенда
        # ВАЖНО: proxy_pass без пути после имени upstream (без "/" в конце) —
        # nginx передаёт оригинальный URI как есть, включая "/api".
        # Backend сам слушает на /api/* (см. app.setGlobalPrefix('api') в
        # main.ts). Раньше здесь стояло "proxy_pass http://backend_upstream/;"
        # (с "/" в конце) — это обрезает совпавший префикс "/api/" перед
        # проксированием, и backend получал бы /products вместо /api/products
        # и отвечал 404 на все запросы. Не проявлялось, пока фронт в dev-режиме
        # ходил в backend напрямую по IP:4000, минуя nginx.
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Загруженные файлы (если раздаём напрямую с backend/uploads)
        location /uploads/ {
            proxy_pass http://backend_upstream/uploads/;
        }

        # Всё остальное — Next.js (в т.ч. /admin, т.к. админка живёт внутри фронта)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
